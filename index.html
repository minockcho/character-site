<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>짱구 캐릭터 소개</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <h1>짱구는 못말려</h1>
    <p>엉뚱하지만 사랑스러운 캐릭터, 짱구를 소개합니다.</p>
    <nav>
      <a href="index.html">홈</a>
      <a href="character.html">캐릭터</a>
      <a href="reason.html">선택 이유</a>
    </nav>
  </header>

  <main class="container">
    <section class="card intro">
      <div>
        <h2>캐릭터 소개</h2>
        <p>
          짱구는 장난기 많고 자유로운 성격을 가진 캐릭터입니다.
          평범한 일상 속에서도 엉뚱한 행동과 솔직한 말투로 웃음을 줍니다.
        </p>
      </div>
      <div class="circle">짱구</div>
    </section>

    <section class="grid">
      <article class="card">
        <h3>성격</h3>
        <p>밝고 당당하며, 하고 싶은 말을 솔직하게 표현합니다.</p>
      </article>
      <article class="card">
        <h3>매력</h3>
        <p>엉뚱한 행동 속에서도 가족과 친구를 생각하는 따뜻함이 있습니다.</p>
      </article>
      <article class="card">
        <h3>분위기</h3>
        <p>유쾌하고 귀여운 이미지로 많은 사람들에게 친근하게 느껴집니다.</p>
      </article>
    </section>
  </main>

  <footer>
    <p>캐릭터 사이트 제작하기 과제</p>
  </footer>
